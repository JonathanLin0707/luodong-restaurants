services:
  - type: web
    name: luodong-restaurants
    plan: free
    runtime: node
    buildCommand: npm --prefix backend install --omit=dev && npm --prefix frontend install --include=dev && npm --prefix frontend run build
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
